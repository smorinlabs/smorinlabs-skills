# Marketplace identity — consumed by harness-kit to generate
# .claude-plugin/marketplace.json (Claude Code),
# .agents/plugins/marketplace.json (Codex), and
# .agents/plugins.json (Antigravity). Per-plugin metadata lives in
# plugins/<name>/plugin.meta.toml.
[marketplace]
name = "smorinlabs-skills"
description = "Public cross-platform (Claude Code + Codex + Antigravity) plugin marketplace for smorinlabs"
version = "0.37.0"
display_name = "smorinlabs skills"

[marketplace.owner]
name = "Steve Morin"
email = "steve.morin@gmail.com"
