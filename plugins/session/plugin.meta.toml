name = "session"
version = "0.18.1"
description = "Session-state septet for coding sessions: session-recap orients when returning to one (arc, done/open, git/PR/worktree state, ranked next steps, close-or-continue verdict — strictly read-only); session-loose-ends is its acting sibling — sweeps working-state artifacts, processes, unfulfilled promises, and tracking drift, reports each with evidence and a keep-or-clean recommendation both ways, then executes and verifies only what was confirmed item by item; session-handoff faces forward — it packages the current session into a self-contained, machine-portable handoff (outcome, repo identity, resume state, and the tacit context that dies on compaction) for a fresh zero-context session to pick up cold; session-status is the mid-flight glance — a manually-triggered, plain-language progress map of the active stream (done rolled up, what's left fine-grained where you stand), probe-free and read-only, with an ASCII kanban board of what's left when work runs in parallel or much remains; session-agent-list finds and lists Claude Code, Codex, Muse, and OpenCode sessions across the machine as action-ready cards — end-state triage (open / handed off / closed clean / loose ends), each tool's session name, what is running now, lineage, and copy-paste resume or transcript commands, filterable by tool; session-spinoff takes a side idea out of the current session and launches it in a fresh Claude Code, Codex, or Muse agent in a Rex tab, on a new worktree from origin, with a self-contained brief as its first prompt — placement ranked by which Rex sessions already work in that repo; session-move relocates a running agent conversation from one Rex session to another on the same computer — the same agent, conversation, working directory, and window name, with the old window closed before the new one resumes so two copies never write one transcript."
author = "Steve Morin"
keywords = ["session", "recap", "orient", "resume", "status", "pr", "worktree", "git", "loose-ends", "cleanup", "handoff", "portability", "progress", "kanban", "board", "list", "find", "codex", "muse", "opencode", "live", "discovery", "spinoff", "rex", "launch", "move", "relocate"]

[interface]
displayName = "Session"
category = "Developer Tools"
