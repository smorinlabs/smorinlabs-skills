<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Session map</title>
<style>
:root{font:15px/1.55 system-ui,-apple-system,sans-serif;color:#1d2939;background:#f6f7f9;--paper:#fff;--muted:#566275;--line:#dce1e8;--blue:#224fd2;--soft:#edf2ff;--warn:#975711}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}a{color:var(--blue)}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:inherit;padding:7px 11px}button:hover{border-color:var(--blue)}:focus-visible{outline:3px solid #e59a20;outline-offset:3px}header{padding:21px 30px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;margin:0;letter-spacing:-.6px}h2{font-size:23px;margin:0 0 9px}h3{font-size:17px;margin:0 0 8px}p{margin:8px 0}small,.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:235px 1fr;min-height:85vh}aside{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px}nav{display:grid;gap:5px}nav a{text-decoration:none;color:inherit;padding:9px 12px;border-radius:7px}nav a[aria-current=page]{background:var(--soft);color:var(--blue);font-weight:650}main{padding:28px;min-width:0;max-width:1500px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}input,select{background:var(--paper);color:inherit;border:1px solid var(--line);border-radius:7px;padding:9px}input{min-width:240px;flex:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}.stat strong{font-size:29px;display:block;line-height:1.2}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{margin-bottom:12px;overflow-wrap:anywhere}.card .tag{margin-right:5px}.tag{display:inline-block;font-size:12px;background:var(--soft);color:var(--blue);padding:2px 7px;border-radius:5px}.warning{color:var(--warn)}.note{border-left:3px solid #d59934;padding:9px 13px;background:var(--paper);margin:14px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.stack{display:grid;gap:6px}code,pre{font:12px/1.5 ui-monospace,SFMono-Regular,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:13px;border-radius:7px;max-height:420px;overflow:auto}.command{position:relative}details{margin:10px 0}summary{cursor:pointer;color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{color:var(--muted)}.scroll{overflow-x:auto}footer{margin-top:24px;font-size:12px;color:var(--muted)}#notice{position:fixed;bottom:20px;right:20px;background:#213348;color:#fff;padding:10px 18px;border-radius:9px;max-width:420px}#notice:empty{display:none}.sideprojects{display:grid;gap:5px;margin-top:22px;max-height:55vh;overflow:auto}.sideprojects a{font-size:12px;padding:3px 10px;text-decoration:none}.pill{font-size:12px;color:var(--muted)}.empty{padding:28px;color:var(--muted)}.progress{display:flex;gap:12px;align-items:center;margin:10px 0}progress{accent-color:var(--blue);width:120px}h2,h3 a{text-decoration:none}.linkbutton{border:none;background:transparent;color:var(--blue);padding:0;text-decoration:underline}
@media(prefers-color-scheme:dark){:root{color:#e1e6ed;background:#111722;--paper:#192231;--muted:#a4b1c4;--line:#334156;--blue:#9bb6ff;--soft:#26354d;--warn:#efbb70}.primary{background:#3459b6;color:#fff}}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px}nav{display:flex;overflow:auto;white-space:nowrap}.sideprojects{display:none}main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}header{padding:17px}.actions{margin-left:0}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div><div class="eyebrow">Projects · conversations · next actions</div><h1>Session map</h1></div><div class="actions"><button id="update" class="primary">Copy update prompt</button><button id="render">Copy render command</button><button id="export">Export inventory</button></div></header>
<div class="layout"><aside><nav aria-label="Map views"><a href="#overview">Overview</a><a href="#projects">Projects</a><a href="#sessions">Sessions</a><a href="#closure">Closure review</a><a href="#history">Conversation history</a><a href="#changes">Changes</a><a href="#sources">Sources &amp; coverage</a></nav><div class="sideprojects" id="project-links"></div></aside>
<main><div class="toolbar"><input id="search" type="search" aria-label="Search map" placeholder="Search projects, sessions, paths…"><select id="manager" aria-label="Filter terminal manager"><option value="">All managers</option></select><select id="agent" aria-label="Filter agent"><option value="">All agents</option></select></div><div id="view"></div><footer id="footer"></footer></main></div><div id="notice" role="status" aria-live="polite"></div>
<script id="inventory" type="application/json">__INVENTORY_JSON__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('inventory').textContent);
const $=id=>document.getElementById(id), E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all={...D.locations,...D.conversations,...D.projects,...D.plans};
const values=obj=>Object.values(obj||{}), date=v=>v?new Date(v).toLocaleString():'Not recorded';
const title=r=>r.overrides?.title||r.title||r.native_id||r.id;
const pids=r=>r.overrides?.project_ids??r.assessment?.project_ids??r.project_ids??[];
const route=(type,id)=>'#'+type+'/'+encodeURIComponent(id);
const projectLink=id=>D.projects[id]?`<a href="${route('project',id)}">${E(title(D.projects[id]))}</a>`:E(id);
const recordLink=id=>all[id]?`<a href="${route(D.projects[id]?'project':D.plans[id]?'plan':'session',id)}">${E(title(all[id]))}</a>`:E(id);
const fileLink=p=>typeof p==='string'&&p.startsWith('/')?`<a href="file://${E(encodeURI(p).replace(/#/g,'%23').replace(/\?/g,'%3F'))}">${E(p)}</a>`:E(p);
let page=0;
function filtered(rows){const q=$('search').value.toLowerCase();return rows.filter(r=>(!$('manager').value||r.manager===$('manager').value)&&(!$('agent').value||r.agent===$('agent').value)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));}
function tag(s){return `<span class="tag">${E(s)}</span>`;}
function state(r){return r.presence==='stale'?'Source unavailable':r.presence==='not_observed'?'No longer observed':r.assessment_needed?'Needs assessment':r.assessment?.status||'Not assessed';}
function command(text,label='Terminal command'){return `<div class="command"><small>${E(label)}</small><pre tabindex="0">${E(text)}</pre><button data-copy="${E(text)}">Copy</button></div>`;}
function navCommand(r){const n=r.navigation;if(!n)return '<p class="muted">No verified tab-navigation command.</p>';const container=D.locations[r.overrides?.container_id];let text=n.command;if(container?.navigation&&container.presence==='observed')text+=' &&\n'+container.navigation.command;return command(text)+`<small>Run from ${E(n.cwd)}. Target observed ${E(date(n.validated_at))}.</small>`;}
function assessment(r){const a=r.assessment;return a?`<p>${E(a.summary)}</p><p><strong>Next:</strong> ${E(a.next_action)}</p><small>Assessed ${E(date(a.assessed_at))} · ${E(a.freshness||'stale')}</small><details><summary>Why this assessment</summary><p>${E(a.rationale)}</p>${(a.evidence_ids||[]).map(recordLink).join(' · ')}</details>`:'<p class="muted">Evidence has been collected. Ownership and completion have not yet been assessed.</p>';}
function correction(r){const o=r.overrides||{};if(!Object.keys(o).length)return '';return `<details open class="note"><summary>Saved user corrections</summary>${o.notes?`<p>${E(o.notes)}</p>`:''}<pre>${E(JSON.stringify(o,null,2))}</pre><small>Observed values remain available in the inventory. Corrections are preserved on update.</small></details>`;}
function card(r){return `<article class="card"><div class="row"><h3><a href="${route(D.projects[r.id]?'project':'session',r.id)}">${E(title(r))}</a></h3>${tag(state(r))}</div><p>${E(r.manager||r.agent||'Project')}${r.manager&&r.agent?' · '+E(r.agent):''}</p><small>${E(r.workspace||r.cwd||'')}</small>${assessment(r)}<p>${pids(r).map(projectLink).join(' · ')}</p></article>`;}
function stats(){const loc=values(D.locations).filter(r=>r.presence==='observed'&&!r.registry_only);return `<div class="stats">${[[loc.length,'Observed terminal locations'],[values(D.conversations).length,'Indexed conversations'],[values(D.projects).length,'Projects / workstreams'],[values(all).filter(r=>r.assessment_needed).length,'Assessments pending']].map(([n,l])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('')}</div>`;}
function session(r){const c=D.conversations[r.conversation_id];return `<h2>${E(title(r))}</h2><button data-copy="${E(r.id)}">Copy session ID</button><p>${tag(state(r))}${tag(r.agent||'Unknown agent')}${r.manager?tag(r.manager):''}</p>${correction(r)}${assessment(r)}<div class="card"><h3>Location</h3><p>${E(r.workspace||'No terminal workspace')} · ${E(r.tab_id||'No tab located')}</p><p>${fileLink(r.cwd)}</p>${navCommand(r)}<details><summary>Exact identity</summary><pre>${E(JSON.stringify({id:r.id,native_id:r.native_id||c?.native_id,workspace_id:r.workspace_id,tab_id:r.tab_id,pane_id:r.pane_id,identity_basis:r.identity_basis,identity_conflict:r.identity_conflict},null,2))}</pre></details>${c?`<p>Conversation: ${recordLink(c.id)}</p>`:''}<p>Projects: ${pids(r).map(projectLink).join(' · ')||'Unresolved'}</p></div><div class="card"><h3>Evidence</h3><p>${E(r.live_basis||'')}${r.manager_status?' · Manager lifecycle: '+E(r.manager_status):''}</p><pre>${E(r.evidence||'No excerpt available')}</pre><small>Observed ${E(date(r.observed_at))}. ${r.transcript?fileLink(r.transcript):''}</small></div>`;}
function plan(r){return `<details class="card"><summary>${E(r.path)} · ${r.phases?.length||0} phases</summary>${(r.phases||[]).map(p=>{const c=Object.fromEntries(Object.entries(p.counts||{}).map(([key,value])=>[key,Number.isSafeInteger(value)&&value>=0?value:0]));return `<section><h3>${E(p.id)} · ${E(p.title)}</h3><p>${E(p.state)}${p.conflict?' · Heading conflicts with task states':''}</p>${c.total?`<div class="progress"><progress max="${c.total}" value="${c.complete||0}"></progress><span>${c.complete||0} complete / ${c.total} numbered tasks · ${(c.open||0)+(c.in_progress||0)} open</span></div><small>${c.implementation||0} implementation tasks · ${c.tests||0} test tasks · ${c.retired||0} retired · ${c.redirected||0} redirected · ${(c.unknown||0)+(c.conflict||0)} unknown/conflicting</small>`:'<p class="warning">Remaining work unknown: no numbered task decomposition.</p>'}<div class="scroll"><table><thead><tr><th>Task</th><th>State</th><th>Work</th></tr></thead><tbody>${(p.tasks||[]).map(t=>`<tr><td>${E(t.id)}</td><td>${E(t.state)}</td><td>${E(t.title)}<small> · line ${E(t.line)}</small>${t.duplicates?'<p class="warning">Duplicate task definitions; inspect the source.</p>':''}</td></tr>`).join('')}</tbody></table></div>${p.acceptance?.length?`<details><summary>${p.acceptance.length} additional checklist / acceptance items</summary><pre>${E(p.acceptance.map(a=>a.text).join('\n'))}</pre></details>`:''}</section>`;}).join('')}<p>${fileLink(r.path)}</p></details>`;}
function project(r){const selected=Object.prototype.hasOwnProperty.call(r.overrides||{},'selected_plan')?r.overrides.selected_plan:r.assessment?.selected_plan;const owners=r.overrides?.owner_ids||r.assessment?.owner_ids||[];const related=values({...D.locations,...D.conversations}).filter(s=>pids(s).includes(r.id));return `<h2>${E(title(r))}</h2><button data-copy="${E(r.id)}">Copy project ID</button>${correction(r)}${assessment(r)}<div class="card"><h3>Current owners</h3>${owners.length?owners.map(recordLink).join(' · '):'<p class="muted">Ownership unresolved. See the related sessions and their evidence.</p>'}</div><h3>Repository locations</h3>${(r.locations||[]).map(l=>`<div class="card"><p>${fileLink(l.path)}</p><small>Branch: ${E(l.branch||'Unknown')} · commit ${E(l.head||'Unknown')}</small><pre>${E(l.status===null?'Status unavailable':l.status||'Working tree clean at observation')}</pre></div>`).join('')}<h3>Plans and phases</h3><p class="muted">${selected?'Selected plan: '+E(D.plans[selected]?.path||selected):'No authoritative plan pinned. Inspect the available versions.'} Counts belong to each plan; do not add shared counts across sessions.</p>${(r.plan_ids||[]).map(id=>D.plans[id]?plan(D.plans[id]):'').join('')||'<p>No project plan found. Remaining work is unknown.</p>'}<h3>Related sessions</h3><div class="grid">${related.map(card).join('')||'<p class="empty">No sessions linked.</p>'}</div>`;}
function history(){const rows=filtered(values(D.conversations)).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));const pages=Math.max(1,Math.ceil(rows.length/30));page=Math.min(page,pages-1);return `<h2>Conversation history</h2><p>${rows.length} records. Indexed history is not proof of completion or active work.</p><div class="grid">${rows.slice(page*30,page*30+30).map(card).join('')}</div><div class="row"><button id="prev" ${page===0?'disabled':''}>Previous</button><span>Page ${page+1} of ${pages}</span><button id="next" ${page===pages-1?'disabled':''}>Next</button></div>`;}
function display(){let [view='overview',id]=location.hash.slice(1).split('/');try{id=id?decodeURIComponent(id):null;}catch{id=null;}document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+view?'page':'false'));let html='';if(view==='session'&&all[id])html=session(all[id]);else if(view==='project'&&D.projects[id])html=project(D.projects[id]);else if(view==='plan'&&D.plans[id])html='<h2>Project plan</h2>'+plan(D.plans[id]);else if(view==='projects')html='<h2>Projects</h2><div class="grid">'+filtered(values(D.projects)).map(card).join('')+'</div>';else if(view==='sessions'){const placed=new Set(values(D.locations).map(l=>l.conversation_id));html='<h2>Sessions</h2><p>Terminal locations and unplaced loaded conversations. Agent Deck registry records are labelled separately.</p><div class="grid">'+filtered([...values(D.locations),...values(D.conversations).filter(c=>!placed.has(c.id)&&c.live!=='no')]).map(card).join('')+'</div>';}else if(view==='closure')html='<h2>Closure review</h2><p>Recommendations only. A stale recommendation requires reassessment before acting.</p><div class="grid">'+filtered(values(all).filter(r=>r.assessment?.closure==='candidate')).map(card).join('')+'</div>';else if(view==='history')html=history();else if(view==='changes')html='<h2>Changes since the last inventory update</h2>'+Object.entries(D.changes||{}).map(([name,ids])=>`<details class="card" open><summary>${E(name)} · ${ids.length}</summary>${ids.map(recordLink).join('<br>')}</details>`).join('');else if(view==='sources')html='<h2>Sources &amp; coverage</h2><p>Unavailable sources retain their prior records as stale. Terminal lifecycle and native liveness are separate from project completion.</p>'+Object.entries(D.sources).map(([name,s])=>`<div class="card"><h3>${E(name)} ${tag(s.status)}</h3><p>${E(s.error||'')}</p><small>Last attempt ${E(date(s.last_attempt))} · last success ${E(date(s.last_success))}</small><pre>${E(JSON.stringify(s,null,2))}</pre></div>`).join('')+`<details><summary>Update metrics and scope</summary><pre>${E(JSON.stringify({metrics:D.metrics,scope:D.scope},null,2))}</pre></details>`;else html='<h2>Where work stands</h2><p class="muted">Browse the projects, find the current owner, and copy a command to its tab.</p>'+stats()+`<div class="note">Inventory observed ${E(date(D.updated_at))}. Assessments retain their own timestamps. This is a local snapshot; copy the update prompt to refresh it.</div><h3>Projects with open sessions</h3><div class="grid">`+filtered(values(D.projects).filter(p=>(p.session_ids||[]).some(id=>{const r=all[id];return r?.presence==='observed'&&((r.manager&&!r.registry_only)||r.live==='yes'||r.live==='unknown');}))).map(card).join('')+'</div>'; $('view').innerHTML=html;$('footer').textContent='Generation '+D.generation_id+' · HTML rendered '+date(D.render.at)+' · '+D.render.map_dir;}
async function copy(text){try{await navigator.clipboard.writeText(text);$('notice').textContent='Copied.';}catch{const area=document.createElement('textarea');area.value=text;area.setAttribute('aria-label','Copy this command');document.body.append(area);area.select();let ok=false;try{ok=document.execCommand('copy');}catch{}if(ok){area.remove();$('notice').textContent='Copied.';}else{$('notice').textContent='Automatic copy unavailable. Select and copy the text below.';area.style.cssText='position:fixed;bottom:70px;left:5%;width:90%;height:100px;z-index:10';area.addEventListener('blur',()=>area.remove(),{once:true});}}}
$('project-links').innerHTML='<span class="eyebrow">Projects</span>'+values(D.projects).sort((a,b)=>title(a).localeCompare(title(b))).map(p=>`<a href="${route('project',p.id)}">${E(title(p))}</a>`).join('');
for(const [id,key,rows] of [['manager','manager',values(D.locations)],['agent','agent',values({...D.locations,...D.conversations})]])for(const value of [...new Set(rows.map(r=>r[key]).filter(Boolean))].sort()){const o=document.createElement('option');o.value=value;o.textContent=value;$(id).append(o);}
for(const id of ['search','manager','agent'])$(id).addEventListener('input',()=>{page=0;display();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-copy'))copy(b.getAttribute('data-copy'));if(b.id==='prev'){page--;display();}if(b.id==='next'){page++;display();}});
$('update').addEventListener('click',()=>copy(D.render.update_prompt));$('render').addEventListener('click',()=>copy(D.render.render_command));$('export').addEventListener('click',()=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.href=u;a.download='session-map-inventory.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);});window.addEventListener('hashchange',()=>{page=0;display();});display();
</script></body></html>
